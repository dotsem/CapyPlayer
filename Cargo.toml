[package]
name = "capy-spell-player"

version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.17.1", features = ["live-preview", "renderer-skia"] }
# spell-framework = "1.0.6"
spell-framework = { path = "../Spell/spell-framework" }
capy-player = { path = "crates/capy-player" }
env_logger = "0.11.3"
log = "0.4.21"
serde = { version = "1.0", features = ["derive"] }
paste = "1.0"
toml = "0.8"

[build-dependencies]
slint-build = "1.17.1"

[patch.crates-io]
slint = { git = "https://github.com/slint-ui/slint" }
slint-build = { git = "https://github.com/slint-ui/slint" }
i-slint-core = { git = "https://github.com/slint-ui/slint" }
i-slint-renderer-skia = { git = "https://github.com/slint-ui/slint" }
