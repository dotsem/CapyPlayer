name: CI
on:
  push:
    branches:
      - main
    paths-ignore: &paths
      - "**.md"
  pull_request:
    paths-ignore: *paths


concurrency:
  group: "ci-${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROFILE: ${{ github.event_name == 'pull_request' && 'dev' || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/build
        with:
          profile: ${{ env.PROFILE }}
      - run: cargo clippy --profile $PROFILE --all-targets --locked -- -D warnings
      - run: cargo test --profile $PROFILE --locked
