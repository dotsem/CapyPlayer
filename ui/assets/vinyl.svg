<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" version="1.1">
  <defs>
    <mask id="vinyl-center-hole">
      <rect x="0" y="0" width="512" height="512" fill="white"/>
      <circle cx="256" cy="256" r="120" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#vinyl-center-hole)">
    <!-- Base black vinyl disc -->
    <circle cx="256" cy="256" r="256" fill="#000000"/>
    <circle cx="256" cy="256" r="254.5" fill="none" stroke="#252830" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="248" fill="none" stroke="#121417" stroke-width="1.5"/>

    <!-- Exact 24 concentric grooves of the original vinyl -->
    <g fill="none" stroke="#484c56" stroke-width="1.1">
      <circle cx="256" cy="256" r="123.7"/>
      <circle cx="256" cy="256" r="128.9"/>
      <circle cx="256" cy="256" r="134.1"/>
      <circle cx="256" cy="256" r="139.3"/>
      <circle cx="256" cy="256" r="144.6"/>
      <circle cx="256" cy="256" r="149.8"/>
      <circle cx="256" cy="256" r="155.0"/>
      <circle cx="256" cy="256" r="160.2"/>
      <circle cx="256" cy="256" r="165.4"/>
      <circle cx="256" cy="256" r="170.7"/>
      <circle cx="256" cy="256" r="175.9"/>
      <circle cx="256" cy="256" r="181.1"/>
      <circle cx="256" cy="256" r="186.3"/>
      <circle cx="256" cy="256" r="191.5"/>
      <circle cx="256" cy="256" r="196.7"/>
      <circle cx="256" cy="256" r="202.0"/>
      <circle cx="256" cy="256" r="207.2"/>
      <circle cx="256" cy="256" r="212.4"/>
